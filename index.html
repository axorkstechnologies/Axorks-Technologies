<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logos/axorks_monogram.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Axorks Technologies | Engineering Studio</title>
    <meta name="description" content="A specialized software engineering studio building production-grade web applications, AI systems, and mobile platforms. We operate on fixed-price milestones with zero hourly tracking." />
    
    <!-- Anti-AI Editorial Typography: Newsreader (Headline) + Public Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
      /* Prevent FOUC and enforce strict background immediately */
      html, body {
        background-color: #F7F5F0; /* Paper */
        color: #0D1014; /* Ink */
        margin: 0;
        padding: 0;
      }
    </style>

    <!-- Comprehensive Structured Data (AEO/SEO) -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Axorks Technologies",
          "url": "https://axorks.com",
          "logo": "https://axorks.com/Logos/axorks_monogram.png",
          "description": "Software engineering studio specializing in AI, Web3, and Full-Stack enterprise systems.",
          "founder": {
            "@type": "Person",
            "name": "Muhammad Mujahid",
            "jobTitle": "Chief Systems Architect"
          }
        },
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does the pricing model work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We operate exclusively on fixed-price milestone contracts. Scope is defined upfront, and you never pay for hourly tracking. Payments are tied directly to verified staging deployments."
              }
            },
            {
              "@type": "Question",
              "name": "Who owns the intellectual property?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Clients receive 100 percent commercial intellectual property ownership upon milestone completion. All source code and architectural documentation are transferred without licensing locks."
              }
            }
          ]
        }
      ]
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
